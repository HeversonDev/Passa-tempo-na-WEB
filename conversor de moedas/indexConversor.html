<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/styleConversor.css">
</head>
<body>


    <div class="default-container">

        <h1>Conversor de moedas</h1>

        
        <div id="conainer-converter">


            <div id="currency-selectors">

                <label>
                    De
                    <select name="" id="coin-one">
                        <option value="USD">DÓLAR AMERICANO</option>
                        <option value="BRL">REAL BRASILEIRO</option>
                        <option value="EUR">EURO</option>
                        <option value="JPY">IENE JAPONÊS</option>
                        <option value="GBP">LIBRA ESTERLINA</option>
                        <option value="CNY">YUAN CHINÊS (RENMINBI)</option>
                        <option value="CHF">FRANCO SUÍÇO</option>
                        <option value="CAD">DÓLAR CANADENSE</option>
                        <option value="AUD">DÓLAR AUSTRALIANO</option>
                        <option value="HKD">DÓLAR DE HONG KONG</option>
                    </select>

                </label>

                <label>
                    Para
                    <select name="" id="coin-two">
                        <option value="USD">DÓLAR AMERICANO</option>
                        <option value="BRL">REAL BRASILEIRO</option>
                        <option value="EUR">EURO</option>
                        <option value="JPY">IENE JAPONÊS</option>
                        <option value="GBP">LIBRA ESTERLINA</option>
                        <option value="CNY">YUAN CHINÊS (RENMINBI)</option>
                        <option value="CHF">FRANCO SUÍÇO</option>
                        <option value="CAD">DÓLAR CANADENSE</option>
                        <option value="AUD">DÓLAR AUSTRALIANO</option>
                        <option value="HKD">DÓLAR DE HONG KONG</option>
                    </select>

                </label>

            </div>


            <label>
                Valor a ser convertido
                <input type="number" name="" id="conversion-value" placeholder="Insira um valor">
            </label>

            <div id="conversion-response">

                <p>Resposta da conversão</p>

            </div>



        </div>



    </div>


    <script src="assets/jscript/scriptConversor.js"></script>
</body>
</html>
