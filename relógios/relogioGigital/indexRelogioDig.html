<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/styleRologioGig.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Squada+One&display=swap" rel="stylesheet">

</head>
<body>

    <h1>Relógio Digital</h1>


    <div class="default-container clock-area">

        <div class="hour ">00</div>
        <div class="points">:</div>
        <div class="minutes">00</div>
        <div class="seconds">00</div>

    </div>

    <div class="default-container select-time-zone">

        <h1>Selecione o país que deseja ver o horário</h1>
        <select name="" id="">
            <option value="br" selected>Brasil</option>
            <option value="eua">Estados Unidos</option>
            <option value="cn">China</option>
            <option value="jp">Japão</option>
            <option value="de">Alemanha</option>
            <option value="uk">Reino Unido</option>
            <option value="fr">França</option>
            <option value="in">India</option>
            <option value="it">Itália</option>
            <option value="ca">Canadá</option>
            <option value="kr">Coreia do Sul</option>
            <option value="au">Austrália</option>
            <option value="es">Espanha</option>
            <option value="ru">Rússia</option>
            <option value="sa">Arábia Saudita</option>
            <option value="ch">Suíça</option>
            <option value="nl">Países Baixos (Holanda)</option>
            <option value="se">Suécia</option>
            <option value="ae">Emirados Árabes Unidos</option>
            <option value="sg">Singapura</option>
        </select>

        <button>Trocar fuso horário</button>

    </div>








    <script src="assets/jscript/scriptRelogioDig.js"></script>
</body>
</html>
