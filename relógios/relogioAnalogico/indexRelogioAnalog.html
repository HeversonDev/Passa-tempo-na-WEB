<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/styleAnalog.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Squada+One&display=swap" rel="stylesheet">

</head>
<body>

    <h1>Relógio Analógico</h1>

    <div class="default-container clock-area">

        <div class="clock-circle">

            
            <div class="second-hand" style="transform: rotate(0deg);"></div>
            <div class="minute-hand" style="transform: rotate(0deg)"></div>
            <div class="hour-hand" style="transform: rotate(0deg)"></div>
            <div class="center"></div>

            <div class="clock-numbers-container" style="rotate: 0deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers" style="rotate: 0deg;"><p>6</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 30deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers"><p>7</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 60deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers"><p>8</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 90deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers" style="rotate: -90deg;"><p>9</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 120deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers" style="rotate: 180deg;"><p>10</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 150deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers" style="rotate: 180deg;"><p>11</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 180deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers" style="rotate: 180deg;"><p>12</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 210deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers" style="rotate: 190deg;"><p>1</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 240deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers" style="rotate: 180deg;"><p>2</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 270deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers" style="rotate: 180deg;"><p>3</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 300deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers"><p>4</p></div>
            </div>
            <div class="clock-numbers-container" style="rotate: 330deg;">
                <div class="clock-markings"></div>
                <div class="clock-numbers"><p>5</p></div>
            </div>


        </div>


        <div class="default-container select-time-zone">

            <h1>Selecione o país que deseja ver o horário</h1>
            <select name="" id="">
                <option value="br" selected>Brasil</option>
                <option value="eua">Estados Unidos</option>
                <option value="cn">China</option>
                <option value="jp">Japão</option>
                <option value="de">Alemanha</option>
                <option value="uk">Reino Unido</option>
                <option value="fr">França</option>
                <option value="in">India</option>
                <option value="it">Itália</option>
                <option value="ca">Canadá</option>
                <option value="kr">Coreia do Sul</option>
                <option value="au">Austrália</option>
                <option value="es">Espanha</option>
                <option value="ru">Rússia</option>
                <option value="sa">Arábia Saudita</option>
                <option value="ch">Suíça</option>
                <option value="nl">Países Baixos (Holanda)</option>
                <option value="se">Suécia</option>
                <option value="ae">Emirados Árabes Unidos</option>
                <option value="sg">Singapura</option>
            </select>
    
            <button>Trocar fuso horário</button>
    
        </div>

    </div>














    <script src="assets/jscript/scriptRelogioAnalog.js"></script>
    
</body>
</html>
