<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/stylePomodoro.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&display=swap" rel="stylesheet">

</head>
<body>


    <div class="default-container">

        <h1>POMODORO 25 MINUTOS</h1>

        <div id="clock-counter-container">

            <div class="clock-counter">

                <p id="minute-clock">25</p>

            </div>

            <div class="separate-points">
                <p>:</p>
            </div>

            <div class="clock-counter">

                <p id="clock-seconds">00</p>

            </div>

        </div>

        <div class="action-buttons">

            <img src="assets/icons/botao-play.png" alt="" id="play-image">

            <img src="assets/icons/botao-de-pausa-de-video.png" alt="" id="pause-image">

            <img src="assets/icons/sinal-de-parada.png" alt="" id="stop-image">

            <img src="assets/icons/reiniciar.png" alt="" id="restart-image">

            <img src="assets/icons/notificacao.png" alt="" id="alert-icon-off">

        </div>

    </div>

















    <script src="assets/javaScript/scriptPomodoro.js"></script>
    
</body>
</html>
